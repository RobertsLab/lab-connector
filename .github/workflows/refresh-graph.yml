name: Refresh network graph

# Rebuilds the Lab Connector graph weekly (and on demand) from live sources,
# commits the regenerated data/ and outputs/ files, then publishes app/ to
# GitHub Pages.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays at 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time. Do not cancel an in-flight deployment
# when a manual re-run overlaps a scheduled run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Crawl + build graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run_all.py --max-posts 40

      - name: Commit refreshed data
        run: |
          git config user.name "lab-connector-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data outputs app/graph-data.js
          git commit -m "chore: weekly graph refresh [skip ci]" || echo "no changes"
          git push || echo "nothing to push"

      # Build the Pages artifact from this job's working tree so the site
      # always reflects the data committed above. A separate checkout in the
      # deploy job would pin to the pre-refresh SHA that triggered the run and
      # publish last week's graph.
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r app/* _site/
          cp data/graph.json _site/data/ || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    # Must exceed the deploy-pages timeout below so a stuck deployment still
    # ends with a clear failure instead of running to the 6-hour job limit.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 600000 ms (10 minutes) is the maximum deploy-pages accepts; larger
          # values are silently capped. Slow "purging_cdn" phases that exceed
          # it still fail and need a manual re-run.
          timeout: 600000
